<title id="title">四孔一组：吹吸与按键</title><desc id="desc">标准独奏排列低音组。松键吹 C4 E4 G4 C5，松键吸 D4 F4 A4 B4；按键吹 C♯4 F4 G♯4 C♯5，按键吸 D♯4 F♯4 A♯4 C5。</desc>
