<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img" aria-labelledby="title desc">
<title id="title">半音、全音与八度</title><desc id="desc">C4 至 C5 的键盘。E4 到 F4、B4 到 C5 是半音；C4 经 C♯4 到 D4 是全音。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}.music-clef{font-family:"Apple Symbols","Segoe UI Symbol","Noto Music",serif}</style>
<rect x="1" y="1" width="718" height="658" rx="18" fill="#fbfaf7" stroke="#d6dedf" stroke-width="1.5"/>
<text x="36" y="57" font-size="34" fill="#25333c" text-anchor="start" font-weight="650">半音、全音与八度</text>
<text x="36" y="100" font-size="27" fill="#56646e" text-anchor="start" font-weight="400">C4 到 C5：一个八度，12 个半音</text><rect x="40" y="140" width="80" height="210" rx="3" fill="white" stroke="#b7c2c7" stroke-width="1.5"/><text x="80" y="320" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">C4</text><rect x="120" y="140" width="80" height="210" rx="3" fill="white" stroke="#b7c2c7" stroke-width="1.5"/><text x="160" y="320" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">D4</text><rect x="200" y="140" width="80" height="210" rx="3" fill="#e9f3f1" stroke="#b7c2c7" stroke-width="1.5"/><text x="240" y="320" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">E4</text><rect x="280" y="140" width="80" height="210" rx="3" fill="#e9f3f1" stroke="#b7c2c7" stroke-width="1.5"/><text x="320" y="320" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">F4</text><rect x="360" y="140" width="80" height="210" rx="3" fill="white" stroke="#b7c2c7" stroke-width="1.5"/><text x="400" y="320" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">G4</text><rect x="440" y="140" width="80" height="210" rx="3" fill="white" stroke="#b7c2c7" stroke-width="1.5"/><text x="480" y="320" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">A4</text><rect x="520" y="140" width="80" height="210" rx="3" fill="#e9f3f1" stroke="#b7c2c7" stroke-width="1.5"/><text x="560" y="320" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">B4</text><rect x="600" y="140" width="80" height="210" rx="3" fill="#e9f3f1" stroke="#b7c2c7" stroke-width="1.5"/><text x="640" y="320" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">C5</text><rect x="95" y="140" width="50" height="122" rx="3" fill="#25333c" stroke="#25333c" stroke-width="1.5"/><text x="120" y="230" font-size="23" fill="white" text-anchor="middle" font-weight="400">C♯</text><rect x="175" y="140" width="50" height="122" rx="3" fill="#25333c" stroke="#25333c" stroke-width="1.5"/><text x="200" y="230" font-size="23" fill="white" text-anchor="middle" font-weight="400">D♯</text><rect x="335" y="140" width="50" height="122" rx="3" fill="#25333c" stroke="#25333c" stroke-width="1.5"/><text x="360" y="230" font-size="23" fill="white" text-anchor="middle" font-weight="400">F♯</text><rect x="415" y="140" width="50" height="122" rx="3" fill="#25333c" stroke="#25333c" stroke-width="1.5"/><text x="440" y="230" font-size="23" fill="white" text-anchor="middle" font-weight="400">G♯</text><rect x="495" y="140" width="50" height="122" rx="3" fill="#25333c" stroke="#25333c" stroke-width="1.5"/><text x="520" y="230" font-size="23" fill="white" text-anchor="middle" font-weight="400">A♯</text><line x1="80" y1="372" x2="640" y2="372" stroke="#276969" stroke-width="3" /><line x1="80" y1="360" x2="80" y2="384" stroke="#276969" stroke-width="3" /><line x1="640" y1="360" x2="640" y2="384" stroke="#276969" stroke-width="3" /><text x="360" y="416" font-size="28" fill="#276969" text-anchor="middle" font-weight="600">同名音 C，相差一个八度</text><rect x="36" y="455" width="648" height="80" rx="10" fill="white" stroke="#d6dedf" stroke-width="1.5"/><text x="58" y="489" font-size="28" fill="#25333c" text-anchor="start" font-weight="600">E4 → F4；B4 → C5</text><text x="58" y="521" font-size="25" fill="#56646e" text-anchor="start" font-weight="400">相邻白键，间隔半音</text><rect x="36" y="551" width="648" height="80" rx="10" fill="white" stroke="#d6dedf" stroke-width="1.5"/><text x="58" y="585" font-size="28" fill="#25333c" text-anchor="start" font-weight="600">C4 → C♯4 → D4</text><text x="58" y="617" font-size="25" fill="#56646e" text-anchor="start" font-weight="400">两个半音，合为全音</text>
</svg>
