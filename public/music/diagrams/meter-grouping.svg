<svg xmlns="http://www.w3.org/2000/svg" width="720" height="690" viewBox="0 0 720 690" role="img" aria-labelledby="title desc">
<title id="title">3/4 与 6/8：分组对照</title><desc id="desc">3/4 的六个八分音符按 2+2+2 分组，6/8 通常按 3+3 分组。色块代表拍子，不表示休止。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}.music-clef{font-family:"Apple Symbols","Segoe UI Symbol","Noto Music",serif}</style>
<rect x="1" y="1" width="718" height="688" rx="18" fill="#fbfaf7" stroke="#d6dedf" stroke-width="1.5"/>
<text x="36" y="57" font-size="34" fill="#25333c" text-anchor="start" font-weight="650">3/4 与 6/8：分组对照</text>
<text x="36" y="103" font-size="27" fill="#56646e" text-anchor="start" font-weight="400">每行都含 6 个八分音符，分组不同。</text><text x="36" y="155" font-size="30" fill="#25333c" text-anchor="start" font-weight="600">3/4：三拍，每拍二等分</text><rect x="60" y="184" width="200" height="124" rx="10" fill="#e9f3f1" stroke="#c0d7d3" stroke-width="1.5"/><text x="160" y="347" font-size="25" fill="#276969" text-anchor="middle" font-weight="400">四分音符一拍</text><rect x="260" y="184" width="200" height="124" rx="10" fill="#e9f3f1" stroke="#c0d7d3" stroke-width="1.5"/><text x="360" y="347" font-size="25" fill="#276969" text-anchor="middle" font-weight="400">四分音符一拍</text><rect x="460" y="184" width="200" height="124" rx="10" fill="#e9f3f1" stroke="#c0d7d3" stroke-width="1.5"/><text x="560" y="347" font-size="25" fill="#276969" text-anchor="middle" font-weight="400">四分音符一拍</text><circle cx="110" cy="224" r="13" fill="#276969" stroke="#276969" stroke-width="2"/><text x="110" y="282" font-size="29" fill="#25333c" text-anchor="middle" font-weight="400">1</text><circle cx="210" cy="224" r="13" fill="white" stroke="#276969" stroke-width="2"/><text x="210" y="282" font-size="29" fill="#25333c" text-anchor="middle" font-weight="400">&amp;</text><circle cx="310" cy="224" r="13" fill="#276969" stroke="#276969" stroke-width="2"/><text x="310" y="282" font-size="29" fill="#25333c" text-anchor="middle" font-weight="400">2</text><circle cx="410" cy="224" r="13" fill="white" stroke="#276969" stroke-width="2"/><text x="410" y="282" font-size="29" fill="#25333c" text-anchor="middle" font-weight="400">&amp;</text><circle cx="510" cy="224" r="13" fill="#276969" stroke="#276969" stroke-width="2"/><text x="510" y="282" font-size="29" fill="#25333c" text-anchor="middle" font-weight="400">3</text><circle cx="610" cy="224" r="13" fill="white" stroke="#276969" stroke-width="2"/><text x="610" y="282" font-size="29" fill="#25333c" text-anchor="middle" font-weight="400">&amp;</text><text x="36" y="408" font-size="30" fill="#25333c" text-anchor="start" font-weight="600">6/8：两大拍，每拍三等分</text><rect x="60" y="437" width="300" height="124" rx="10" fill="#faf0e2" stroke="#e0cbb2" stroke-width="1.5"/><text x="210" y="603" font-size="25" fill="#925c24" text-anchor="middle" font-weight="400">附点四分音符一拍</text><rect x="360" y="437" width="300" height="124" rx="10" fill="#faf0e2" stroke="#e0cbb2" stroke-width="1.5"/><text x="510" y="603" font-size="25" fill="#925c24" text-anchor="middle" font-weight="400">附点四分音符一拍</text><circle cx="110" cy="477" r="13" fill="#925c24" stroke="#925c24" stroke-width="2"/><text x="110" y="535" font-size="29" fill="#25333c" text-anchor="middle" font-weight="400">1</text><circle cx="210" cy="477" r="13" fill="white" stroke="#925c24" stroke-width="2"/><text x="210" y="535" font-size="29" fill="#25333c" text-anchor="middle" font-weight="400">2</text><circle cx="310" cy="477" r="13" fill="white" stroke="#925c24" stroke-width="2"/><text x="310" y="535" font-size="29" fill="#25333c" text-anchor="middle" font-weight="400">3</text><circle cx="410" cy="477" r="13" fill="#925c24" stroke="#925c24" stroke-width="2"/><text x="410" y="535" font-size="29" fill="#25333c" text-anchor="middle" font-weight="400">4</text><circle cx="510" cy="477" r="13" fill="white" stroke="#925c24" stroke-width="2"/><text x="510" y="535" font-size="29" fill="#25333c" text-anchor="middle" font-weight="400">5</text><circle cx="610" cy="477" r="13" fill="white" stroke="#925c24" stroke-width="2"/><text x="610" y="535" font-size="29" fill="#25333c" text-anchor="middle" font-weight="400">6</text><text x="36" y="657" font-size="25" fill="#56646e" text-anchor="start" font-weight="400">色块表示一拍，圆点表示八分音符位置。</text>
</svg>
