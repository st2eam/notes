<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img" aria-labelledby="title desc">
<title id="title">扫弦：方向与拍点</title><desc id="desc">下扫从四弦到一弦，上扫反向。4/4 八分细分示例：D、空挥、D、U、空挥、U、D、U。空挥不代表切断声音。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}.music-clef{font-family:"Apple Symbols","Segoe UI Symbol","Noto Music",serif}</style>
<rect x="1" y="1" width="718" height="658" rx="18" fill="#fbfaf7" stroke="#d6dedf" stroke-width="1.5"/>
<text x="36" y="57" font-size="34" fill="#25333c" text-anchor="start" font-weight="650">扫弦：方向与拍点</text>
<text x="36" y="101" font-size="25" fill="#56646e" text-anchor="start" font-weight="400">方向按琴弦位置定义；不是音高上升 / 下降。</text><rect x="30" y="133" width="315" height="203" rx="12" fill="white" stroke="#d6dedf" stroke-width="1.5"/><text x="54" y="173" font-size="29" fill="#276969" text-anchor="start" font-weight="650">D · 下扫</text><text x="54" y="209" font-size="26" fill="#56646e" text-anchor="start" font-weight="400">G</text><line x1="98" y1="201" x2="258" y2="201" stroke="#276969" stroke-width="2" /><text x="54" y="243" font-size="26" fill="#56646e" text-anchor="start" font-weight="400">C</text><line x1="98" y1="235" x2="258" y2="235" stroke="#276969" stroke-width="2" /><text x="54" y="277" font-size="26" fill="#56646e" text-anchor="start" font-weight="400">E</text><line x1="98" y1="269" x2="258" y2="269" stroke="#276969" stroke-width="2" /><text x="54" y="311" font-size="26" fill="#56646e" text-anchor="start" font-weight="400">A</text><line x1="98" y1="303" x2="258" y2="303" stroke="#276969" stroke-width="2" /><line x1="294" y1="199" x2="294" y2="304" stroke="#276969" stroke-width="4" /><polygon points="294.00,304.00 287.91,291.39 300.09,291.39" fill="#276969"/><rect x="375" y="133" width="315" height="203" rx="12" fill="white" stroke="#d6dedf" stroke-width="1.5"/><text x="399" y="173" font-size="29" fill="#276969" text-anchor="start" font-weight="650">U · 上扫</text><text x="399" y="209" font-size="26" fill="#56646e" text-anchor="start" font-weight="400">G</text><line x1="443" y1="201" x2="603" y2="201" stroke="#276969" stroke-width="2" /><text x="399" y="243" font-size="26" fill="#56646e" text-anchor="start" font-weight="400">C</text><line x1="443" y1="235" x2="603" y2="235" stroke="#276969" stroke-width="2" /><text x="399" y="277" font-size="26" fill="#56646e" text-anchor="start" font-weight="400">E</text><line x1="443" y1="269" x2="603" y2="269" stroke="#276969" stroke-width="2" /><text x="399" y="311" font-size="26" fill="#56646e" text-anchor="start" font-weight="400">A</text><line x1="443" y1="303" x2="603" y2="303" stroke="#276969" stroke-width="2" /><line x1="639" y1="304" x2="639" y2="199" stroke="#276969" stroke-width="4" /><polygon points="639.00,199.00 645.09,211.61 632.91,211.61" fill="#276969"/><text x="36" y="389" font-size="29" fill="#25333c" text-anchor="start" font-weight="600">4/4 拍 · 每格一个八分音符</text><text x="59" y="435" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">1</text><rect x="26" y="453" width="66" height="77" rx="8" fill="#e9f3f1" stroke="#c0d7d3" stroke-width="1.5"/><text x="59" y="502" font-size="31" fill="#276969" text-anchor="middle" font-weight="600">D</text><text x="145" y="435" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">&amp;</text><rect x="112" y="453" width="66" height="77" rx="8" fill="white" stroke="#c0d7d3" stroke-width="1.5"/><text x="145" y="502" font-size="31" fill="#56646e" text-anchor="middle" font-weight="600">—</text><text x="231" y="435" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">2</text><rect x="198" y="453" width="66" height="77" rx="8" fill="#e9f3f1" stroke="#c0d7d3" stroke-width="1.5"/><text x="231" y="502" font-size="31" fill="#276969" text-anchor="middle" font-weight="600">D</text><text x="317" y="435" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">&amp;</text><rect x="284" y="453" width="66" height="77" rx="8" fill="#e9f3f1" stroke="#c0d7d3" stroke-width="1.5"/><text x="317" y="502" font-size="31" fill="#276969" text-anchor="middle" font-weight="600">U</text><text x="403" y="435" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">3</text><rect x="370" y="453" width="66" height="77" rx="8" fill="white" stroke="#c0d7d3" stroke-width="1.5"/><text x="403" y="502" font-size="31" fill="#56646e" text-anchor="middle" font-weight="600">—</text><text x="489" y="435" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">&amp;</text><rect x="456" y="453" width="66" height="77" rx="8" fill="#e9f3f1" stroke="#c0d7d3" stroke-width="1.5"/><text x="489" y="502" font-size="31" fill="#276969" text-anchor="middle" font-weight="600">U</text><text x="575" y="435" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">4</text><rect x="542" y="453" width="66" height="77" rx="8" fill="#e9f3f1" stroke="#c0d7d3" stroke-width="1.5"/><text x="575" y="502" font-size="31" fill="#276969" text-anchor="middle" font-weight="600">D</text><text x="661" y="435" font-size="27" fill="#25333c" text-anchor="middle" font-weight="600">&amp;</text><rect x="628" y="453" width="66" height="77" rx="8" fill="#e9f3f1" stroke="#c0d7d3" stroke-width="1.5"/><text x="661" y="502" font-size="31" fill="#276969" text-anchor="middle" font-weight="600">U</text><text x="36" y="579" font-size="28" fill="#25333c" text-anchor="start" font-weight="550">“—”处保持空挥，不触弦。</text><text x="36" y="623" font-size="25" fill="#56646e" text-anchor="start" font-weight="400">之前的声音可延续；空挥不等于休止。</text>
