<svg xmlns="http://www.w3.org/2000/svg" width="720" height="726" viewBox="0 0 720 726" role="img" aria-labelledby="title desc">
<title id="title">五线谱：线、间与中央 C</title><desc id="desc">高音谱表五条线从下向上为 E4 G4 B4 D5 F5，四个间为 F4 A4 C5 E5；C4 位于下加一线。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}.music-clef{font-family:"Apple Symbols","Segoe UI Symbol","Noto Music",serif}</style>
<rect x="1" y="1" width="718" height="724" rx="18" fill="#fbfaf7" stroke="#d6dedf" stroke-width="1.5"/>
<text x="36" y="57" font-size="34" fill="#25333c" text-anchor="start" font-weight="650">五线谱：线、间与中央 C</text>
<text x="36" y="106" font-size="28" fill="#276969" text-anchor="start" font-weight="600">高音谱表 · 线上的音</text><line x1="62" y1="166" x2="670" y2="166" stroke="#b7c2c7" stroke-width="2" /><line x1="62" y1="194" x2="670" y2="194" stroke="#b7c2c7" stroke-width="2" /><line x1="62" y1="222" x2="670" y2="222" stroke="#b7c2c7" stroke-width="2" /><line x1="62" y1="250" x2="670" y2="250" stroke="#276969" stroke-width="2" /><line x1="62" y1="278" x2="670" y2="278" stroke="#b7c2c7" stroke-width="2" /><text class="music-clef" x="66" y="297" font-size="224" fill="#25333c">𝄞</text><line x1="175" y1="306" x2="225" y2="306" stroke="#925c24" stroke-width="2" /><ellipse cx="200" cy="306" rx="13" ry="9" transform="rotate(-18 200 306)" fill="#925c24"/><line x1="212" y1="306" x2="212" y2="254" stroke="#925c24" stroke-width="2.5" /><text x="200" y="350" font-size="26" fill="#925c24" text-anchor="middle" font-weight="600">C4</text><ellipse cx="284" cy="278" rx="13" ry="9" transform="rotate(-18 284 278)" fill="#25333c"/><line x1="296" y1="278" x2="296" y2="226" stroke="#25333c" stroke-width="2.5" /><text x="284" y="350" font-size="26" fill="#25333c" text-anchor="middle" font-weight="600">E4</text><ellipse cx="368" cy="250" rx="13" ry="9" transform="rotate(-18 368 250)" fill="#25333c"/><line x1="380" y1="250" x2="380" y2="198" stroke="#25333c" stroke-width="2.5" /><text x="368" y="350" font-size="26" fill="#25333c" text-anchor="middle" font-weight="600">G4</text><ellipse cx="452" cy="222" rx="13" ry="9" transform="rotate(-18 452 222)" fill="#25333c"/><line x1="440" y1="222" x2="440" y2="274" stroke="#25333c" stroke-width="2.5" /><text x="452" y="350" font-size="26" fill="#25333c" text-anchor="middle" font-weight="600">B4</text><ellipse cx="536" cy="194" rx="13" ry="9" transform="rotate(-18 536 194)" fill="#25333c"/><line x1="524" y1="194" x2="524" y2="246" stroke="#25333c" stroke-width="2.5" /><text x="536" y="350" font-size="26" fill="#25333c" text-anchor="middle" font-weight="600">D5</text><ellipse cx="620" cy="166" rx="13" ry="9" transform="rotate(-18 620 166)" fill="#25333c"/><line x1="608" y1="166" x2="608" y2="218" stroke="#25333c" stroke-width="2.5" /><text x="620" y="350" font-size="26" fill="#25333c" text-anchor="middle" font-weight="600">F5</text><text x="36" y="392" font-size="25" fill="#56646e" text-anchor="start" font-weight="400">C4 在下加一线；第二线是 G4。</text><text x="36" y="449" font-size="28" fill="#276969" text-anchor="start" font-weight="600">高音谱表 · 间里的音</text><line x1="62" y1="478" x2="670" y2="478" stroke="#b7c2c7" stroke-width="2" /><line x1="62" y1="506" x2="670" y2="506" stroke="#b7c2c7" stroke-width="2" /><line x1="62" y1="534" x2="670" y2="534" stroke="#b7c2c7" stroke-width="2" /><line x1="62" y1="562" x2="670" y2="562" stroke="#b7c2c7" stroke-width="2" /><line x1="62" y1="590" x2="670" y2="590" stroke="#b7c2c7" stroke-width="2" /><text class="music-clef" x="66" y="609" font-size="224" fill="#25333c">𝄞</text><ellipse cx="230" cy="576" rx="13" ry="9" transform="rotate(-18 230 576)" fill="#25333c"/><line x1="242" y1="576" x2="242" y2="524" stroke="#25333c" stroke-width="2.5" /><text x="230" y="643" font-size="26" fill="#25333c" text-anchor="middle" font-weight="600">F4</text><ellipse cx="360" cy="548" rx="13" ry="9" transform="rotate(-18 360 548)" fill="#25333c"/><line x1="372" y1="548" x2="372" y2="496" stroke="#25333c" stroke-width="2.5" /><text x="360" y="643" font-size="26" fill="#25333c" text-anchor="middle" font-weight="600">A4</text><ellipse cx="490" cy="520" rx="13" ry="9" transform="rotate(-18 490 520)" fill="#25333c"/><line x1="478" y1="520" x2="478" y2="572" stroke="#25333c" stroke-width="2.5" /><text x="490" y="643" font-size="26" fill="#25333c" text-anchor="middle" font-weight="600">C5</text><ellipse cx="620" cy="492" rx="13" ry="9" transform="rotate(-18 620 492)" fill="#25333c"/><line x1="608" y1="492" x2="608" y2="544" stroke="#25333c" stroke-width="2.5" /><text x="620" y="643" font-size="26" fill="#25333c" text-anchor="middle" font-weight="600">E5</text><text x="36" y="693" font-size="25" fill="#56646e" text-anchor="start" font-weight="400">线与间均从下向上数；中央 C = C4。</text>
</svg>
