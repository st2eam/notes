<svg xmlns="http://www.w3.org/2000/svg" width="720" height="790" viewBox="0 0 720 790" role="img" aria-labelledby="title desc">
<title id="title">弦序与音高：高 G / 低 G</title><desc id="desc">高 G 四弦至一弦为 G4 C4 E4 A4，最低为三弦；低 G 为 G3 C4 E4 A4，最低为四弦。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}.music-clef{font-family:"Apple Symbols","Segoe UI Symbol","Noto Music",serif}</style>
<rect x="1" y="1" width="718" height="788" rx="18" fill="#fbfaf7" stroke="#d6dedf" stroke-width="1.5"/>
<text x="36" y="57" font-size="34" fill="#25333c" text-anchor="start" font-weight="650">弦序与音高：高 G / 低 G</text>
<text x="36" y="102" font-size="25" fill="#56646e" text-anchor="start" font-weight="400">按演奏姿势，从靠脸一侧向靠地面一侧读。</text><rect x="30" y="142" width="660" height="272" rx="12" fill="white" stroke="#d6dedf" stroke-width="1.5"/><text x="52" y="184" font-size="29" fill="#276969" text-anchor="start" font-weight="650">高 G · 回入式调弦</text><text x="52" y="240" font-size="26" fill="#25333c" text-anchor="start" font-weight="400">四弦</text><line x1="126" y1="232" x2="463" y2="232" stroke="#276969" stroke-width="2.5" /><circle cx="484" cy="232" r="5" fill="#276969" stroke="none" stroke-width="2"/><text x="523" y="241" font-size="29" fill="#276969" text-anchor="middle" font-weight="650">G4</text><text x="52" y="286" font-size="26" fill="#25333c" text-anchor="start" font-weight="400">三弦</text><line x1="126" y1="278" x2="463" y2="278" stroke="#276969" stroke-width="2.5" /><circle cx="484" cy="278" r="5" fill="#276969" stroke="none" stroke-width="2"/><text x="523" y="287" font-size="29" fill="#276969" text-anchor="middle" font-weight="650">C4</text><rect x="564" y="257" width="105" height="38" rx="7" fill="#e9f3f1" stroke="none" stroke-width="1.5"/><text x="616" y="285" font-size="24" fill="#276969" text-anchor="middle" font-weight="600">最低音</text><text x="52" y="332" font-size="26" fill="#25333c" text-anchor="start" font-weight="400">二弦</text><line x1="126" y1="324" x2="463" y2="324" stroke="#276969" stroke-width="2.5" /><circle cx="484" cy="324" r="5" fill="#276969" stroke="none" stroke-width="2"/><text x="523" y="333" font-size="29" fill="#276969" text-anchor="middle" font-weight="650">E4</text><text x="52" y="378" font-size="26" fill="#25333c" text-anchor="start" font-weight="400">一弦</text><line x1="126" y1="370" x2="463" y2="370" stroke="#276969" stroke-width="2.5" /><circle cx="484" cy="370" r="5" fill="#276969" stroke="none" stroke-width="2"/><text x="523" y="379" font-size="29" fill="#276969" text-anchor="middle" font-weight="650">A4</text><rect x="30" y="438" width="660" height="272" rx="12" fill="white" stroke="#d6dedf" stroke-width="1.5"/><text x="52" y="480" font-size="29" fill="#925c24" text-anchor="start" font-weight="650">低 G · 只改四弦</text><text x="52" y="536" font-size="26" fill="#25333c" text-anchor="start" font-weight="400">四弦</text><line x1="126" y1="528" x2="463" y2="528" stroke="#925c24" stroke-width="2.5" /><circle cx="484" cy="528" r="5" fill="#925c24" stroke="none" stroke-width="2"/><text x="523" y="537" font-size="29" fill="#925c24" text-anchor="middle" font-weight="650">G3</text><rect x="564" y="507" width="105" height="38" rx="7" fill="#faf0e2" stroke="none" stroke-width="1.5"/><text x="616" y="535" font-size="24" fill="#925c24" text-anchor="middle" font-weight="600">最低音</text><text x="52" y="582" font-size="26" fill="#25333c" text-anchor="start" font-weight="400">三弦</text><line x1="126" y1="574" x2="463" y2="574" stroke="#925c24" stroke-width="2.5" /><circle cx="484" cy="574" r="5" fill="#925c24" stroke="none" stroke-width="2"/><text x="523" y="583" font-size="29" fill="#925c24" text-anchor="middle" font-weight="650">C4</text><text x="52" y="628" font-size="26" fill="#25333c" text-anchor="start" font-weight="400">二弦</text><line x1="126" y1="620" x2="463" y2="620" stroke="#925c24" stroke-width="2.5" /><circle cx="484" cy="620" r="5" fill="#925c24" stroke="none" stroke-width="2"/><text x="523" y="629" font-size="29" fill="#925c24" text-anchor="middle" font-weight="650">E4</text><text x="52" y="674" font-size="26" fill="#25333c" text-anchor="start" font-weight="400">一弦</text><line x1="126" y1="666" x2="463" y2="666" stroke="#925c24" stroke-width="2.5" /><circle cx="484" cy="666" r="5" fill="#925c24" stroke="none" stroke-width="2"/><text x="523" y="675" font-size="29" fill="#925c24" text-anchor="middle" font-weight="650">A4</text><text x="36" y="757" font-size="26" fill="#56646e" text-anchor="start" font-weight="400">弦的物理位置上下，不等于音高高低。</text>
</svg>
